<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Praxis Media — Post 1</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  .slide {
    width: 100%;
    max-width: 540px;
    margin: 0 auto 16px auto;
    display: block;
  }
  .slide svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .marker {
    color: #7FA8D0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 8px 0 4px 0;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- SLIDE 1 -->
<div class="marker">Slide 1 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">ARTICLE 31</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="600" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#FFFFFF">Your personal data</text>
  <text x="90" y="690" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#FFFFFF">is protected by</text>
  <text x="90" y="780" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#FFFFFF">the Constitution</text>
  <text x="90" y="870" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#FFFFFF">of Kenya.</text>
  <text x="90" y="1180" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#7FA8D0">Article 31(c) and (d)</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">1 / 6</text>
</svg>
</div>

<!-- SLIDE 2 -->
<div class="marker">Slide 2 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">ARTICLE 31</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="450" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">Article 31 guarantees</text>
  <text x="90" y="520" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">every person the right</text>
  <text x="90" y="590" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">to privacy.</text>
  <rect x="90" y="680" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="820" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">"No person shall be</text>
  <text x="90" y="875" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">subjected to unnecessary</text>
  <text x="90" y="930" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">requirements to reveal</text>
  <text x="90" y="985" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">information relating to their</text>
  <text x="90" y="1040" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">family or private affairs."</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">2 / 6</text>
</svg>
</div>

<!-- SLIDE 3 -->
<div class="marker">Slide 3 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">ARTICLE 31</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="450" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">It also says:</text>
  <rect x="90" y="540" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="700" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">"No person shall have</text>
  <text x="90" y="765" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">the privacy of their</text>
  <text x="90" y="830" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">communications infringed."</text>
  <text x="90" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#7FA8D0">That means your phone calls.</text>
  <text x="90" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#7FA8D0">Your messages. Your emails.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">3 / 6</text>
</svg>
</div>

<!-- SLIDE 4 -->
<div class="marker">Slide 4 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">ARTICLE 31</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="600" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">But the Constitution</text>
  <text x="90" y="670" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">is a promise.</text>
  <rect x="90" y="780" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="920" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#FFFFFF">The Data Protection Act, 2019</text>
  <text x="90" y="975" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#FFFFFF">is the law that keeps</text>
  <text x="90" y="1030" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#FFFFFF">that promise.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">4 / 6</text>
</svg>
</div>

<!-- SLIDE 5 -->
<div class="marker">Slide 5 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">SECTION 26</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="440" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">The Act gives you</text>
  <text x="90" y="510" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">8 rights.</text>
  <rect x="90" y="600" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="740" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to access your data</text>
  <text x="90" y="820" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to correct it</text>
  <text x="90" y="900" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to delete it</text>
  <text x="90" y="980" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to know who has it</text>
  <text x="90" y="1120" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">And four more.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">5 / 6</text>
</svg>
</div>

<!-- SLIDE 6 -->
<div class="marker">Slide 6 of 6</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">KNOW YOUR RIGHTS</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="560" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">Data protection is not</text>
  <text x="90" y="630" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">a corporate issue.</text>
  <rect x="90" y="740" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="890" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">It is a human</text>
  <text x="90" y="980" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">rights issue.</text>
  <text x="90" y="1140" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7FA8D0">Article 31 of the Constitution.</text>
  <text x="90" y="1185" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7FA8D0">Section 26 of the Data Protection Act.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">6 / 6</text>
</svg>
</div>

</body>
</html>
