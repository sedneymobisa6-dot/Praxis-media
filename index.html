<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Praxis Media — Compliance Advisory</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  .slide {
    width: 100%;
    max-width: 540px;
    margin: 0 auto 16px auto;
    display: block;
  }
  .slide svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .marker {
    color: #7FA8D0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 8px 0 4px 0;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- SLIDE 1 -->
<div class="marker">Slide 1 of 5</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7FA8D0" letter-spacing="6">COMPLIANCE ADVISORY</text>
  <rect x="90" y="185" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="420" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">The Office of the</text>
  <text x="90" y="490" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">Data Protection</text>
  <text x="90" y="560" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">Commissioner</text>
  <text x="90" y="670" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#7FA8D0">is the regulator established under</text>
  <text x="90" y="725" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#7FA8D0">the Data Protection Act, 2019.</text>
  <rect x="90" y="820" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="940" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">Every organisation that determines</text>
  <text x="90" y="995" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">how and why personal data is</text>
  <text x="90" y="1050" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">processed is a Data Controller.</text>
  <text x="90" y="1140" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Registration is mandatory.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">1 / 5</text>
</svg>
</div>

<!-- SLIDE 2 -->
<div class="marker">Slide 2 of 5</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7FA8D0" letter-spacing="6">WHO IS EXEMPT</text>
  <rect x="90" y="185" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="380" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">Exemption applies</text>
  <text x="90" y="445" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">only where BOTH:</text>
  <rect x="90" y="540" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="660" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Annual turnover below</text>
  <text x="90" y="715" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">KES 5 million,</text>
  <text x="90" y="800" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">AND</text>
  <text x="90" y="885" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Fewer than</text>
  <text x="90" y="940" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">10 employees.</text>
  <rect x="90" y="1030" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="1130" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF">No exemption for education,</text>
  <text x="90" y="1185" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF">healthcare, finance, transport,</text>
  <text x="90" y="1240" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF">hospitality, telecom, security.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">2 / 5</text>
</svg>
</div>

<!-- SLIDE 3 -->
<div class="marker">Slide 3 of 5</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7FA8D0" letter-spacing="6">THE PROCESS</text>
  <rect x="90" y="185" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">1. Apply online</text>
  <text x="90" y="470" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">via the ODPC portal</text>
  <text x="90" y="590" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">2. Pay the fee</text>
  <text x="90" y="660" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">Micro/Small: KES 4,000</text>
  <text x="90" y="780" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">3. Receive certificate</text>
  <text x="90" y="850" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">Issued within 14 days</text>
  <text x="90" y="970" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">4. Renew every 24 months</text>
  <text x="90" y="1040" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">Notify ODPC of changes within 14 days</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">3 / 5</text>
</svg>
</div>

<!-- SLIDE 4 -->
<div class="marker">Slide 4 of 5</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7FA8D0" letter-spacing="6">CONSEQUENCES</text>
  <rect x="90" y="185" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Administrative fine:</text>
  <text x="90" y="480" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Up to KES 5M</text>
  <text x="90" y="540" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#7FA8D0">or 1% of annual turnover, whichever is lower</text>
  <rect x="90" y="630" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="740" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Enforcement notices issued</text>
  <text x="90" y="840" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Compensation orders to data subjects</text>
  <text x="90" y="940" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Daily fines up to KES 10,000 per breach</text>
  <text x="90" y="1040" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">Criminal liability on conviction</text>
  <rect x="90" y="1130" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="1230" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">The ODPC is actively enforcing.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">4 / 5</text>
</svg>
</div>

<!-- SLIDE 5 -->
<div class="marker">Slide 5 of 5</div>
<div class="slide">
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7FA8D0" letter-spacing="6">CASE IN POINT</text>
  <rect x="90" y="185" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">OPPO Kenya</text>
  <text x="90" y="500" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">KES 5 million</text>
  <text x="90" y="570" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">penalty imposed by the ODPC</text>
  <rect x="90" y="660" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="770" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">Used a customer's photograph</text>
  <text x="90" y="825" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">on Instagram without consent.</text>
  <text x="90" y="920" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">Failed to comply with an ODPC</text>
  <text x="90" y="975" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#FFFFFF">enforcement notice.</text>
  <rect x="90" y="1060" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="1160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Public visibility does not</text>
  <text x="90" y="1215" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">equal lawful processing rights.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">5 / 5</text>
</svg>
</div>
