<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">ARTICLE 31</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="450" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">It also says:</text>
  <rect x="90" y="540" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="700" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">"No person shall have</text>
  <text x="90" y="765" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">the privacy of their</text>
  <text x="90" y="830" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">communications infringed."</text>
  <text x="90" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#7FA8D0">That means your phone calls.</text>
  <text x="90" y="1055" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#7FA8D0">Your messages. Your emails.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">3 / 6</text>
</svg>