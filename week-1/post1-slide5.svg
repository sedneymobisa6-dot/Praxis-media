<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#0A3D62"/>
  <text x="90" y="180" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#7FA8D0" letter-spacing="6">SECTION 26</text>
  <rect x="90" y="205" width="140" height="4" fill="#7FA8D0"/>
  <text x="90" y="440" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">The Act gives you</text>
  <text x="90" y="510" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">8 rights.</text>
  <rect x="90" y="600" width="60" height="4" fill="#7FA8D0"/>
  <text x="90" y="740" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to access your data</text>
  <text x="90" y="820" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to correct it</text>
  <text x="90" y="900" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to delete it</text>
  <text x="90" y="980" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#FFFFFF">The right to know who has it</text>
  <text x="90" y="1120" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#7FA8D0">And four more.</text>
  <text x="990" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7FA8D0" text-anchor="end">5 / 6</text>
</svg>